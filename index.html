function renderQuiz() {
    const container = document.getElementById('quiz-container');
    questionsData.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let html = `<span class="page-tag">Trang ${data.page}</span>`;
        html += `<div class="question-title">Câu ${index + 1}: ${data.q}</div>`;
        
        data.options.forEach((opt, optIndex) => {
            const isCorrect = optIndex === data.answer ? 'correct' : '';
            html += `<div class="option ${isCorrect}">${opt}</div>`;
        });
        
        card.innerHTML = html;
        container.appendChild(card);
    });
}

renderQuiz();
</script>
